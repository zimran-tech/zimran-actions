# Updated Composite Action: deploy/action.yml
name: 'Deploy'
description: 'Deploy service to EKS cluster using centralized Helm values'
inputs:
  service_name:
    description: 'Name of the service'
    required: true
  environment:
    description: 'Environment to deploy'
    required: true
  helm_version:
    description: 'Helm chart version'
    required: true
  k8s_namespace:
    description: 'Kubernetes namespace'
    required: true
  image_name:
    description: 'Name of the image to deploy'
    required: true
  product_name:
    description: 'Name of the product'
    required: true
  values_repository:
    description: 'The central repository for helm values (e.g., your-org/product-helm-values)'
    required: true
    default: 'your-org/product-helm-values'
  aws_role:
    description: 'AWS role to assume'
    required: true
  aws_region:
    description: 'AWS region'
    required: true
  cluster_name:
    description: 'Name of the cluster'
    required: true
  debug_enabled:
    description: 'Enable debug mode'
    required: false
    default: 'false'
  update_api_docs:
    description: 'Update API docs'
    required: false
    default: 'false'
  github_pat:
    description: 'GitHub personal access token'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Checkout Service Code
      uses: actions/checkout@v4

    - name: Checkout Helm Values Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.values_repository }}
        token: ${{ inputs.github_pat }}

    - name: Update kube config
      shell: bash
      run: |
        aws eks update-kubeconfig --name ${{ inputs.cluster_name }} --region ${{ inputs.aws_region }} --kubeconfig ./kubeconfig
        echo "KUBE_CONFIG_DATA=$(cat ./kubeconfig | base64)" >> $GITHUB_ENV

    - name: Build Helm Command & Deploy
      uses: koslib/helm-eks-action@master
      env:
        KUBE_CONFIG_DATA: ${{ env.KUBE_CONFIG_DATA }}
      with:
        command: |
          helm repo add prosperi-charts https://zimran-tech.github.io/helm-charts
          helm repo update

          SHARED_VALUES_PATH="./${{ inputs.environment }}/shared.yaml"
          SERVICE_VALUES_PATH="./${{ inputs.environment }}/${{ inputs.service_name }}.yaml"

          HELM_COMMAND="helm upgrade --install ${{ inputs.service_name }} prosperi-charts/app \
            --version ${{ inputs.helm_version }} \
            -n ${{ inputs.k8s_namespace }} \
            --set image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.image_name }} \
            ${{ (contains(inputs.debug_enabled, 'true') && '--debug') || '' }}"

          if [ -f "$SHARED_VALUES_PATH" ]; then
            HELM_COMMAND="$HELM_COMMAND -f $SHARED_VALUES_PATH"
            echo "✅ Found and included shared values file: $SHARED_VALUES_PATH"
          else
            echo "🟡 Shared values file not found, skipping: $SHARED_VALUES_PATH"
          fi

          if [ -f "$SERVICE_VALUES_PATH" ]; then
            HELM_COMMAND="$HELM_COMMAND -f $SERVICE_VALUES_PATH"
            echo "✅ Found and included service-specific values file: $SERVICE_VALUES_PATH"
          else
            echo "🟡 Service-specific values file not found, skipping: $SERVICE_VALUES_PATH"
          fi

          echo "Executing: $HELM_COMMAND"
          $HELM_COMMAND

    - name: Update API docs
      if: ${{ inputs.update_api_docs == 'true' }}
      uses: actions/github-script@v6
      with:
        github-token: ${{ inputs.github_pat }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
             owner: context.repo.owner,
             repo: 'api-docs',
             workflow_id: '${{ inputs.product_name }}.yml',
             ref: 'develop'
          })
